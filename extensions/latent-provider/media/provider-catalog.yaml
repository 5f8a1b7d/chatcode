# OpenMAIC provider catalog. User credentials are stored separately.
schemaVersion: 1
source: OpenMAIC-main
categories:
  - id: token-plan
    label: Token Plan
    order: 0
  - id: llm
    label: LLM
    order: 1
  - id: image
    label: Image
    order: 2
  - id: video
    label: Video
    order: 3
  - id: tts
    label: TTS
    order: 4
  - id: asr
    label: ASR
    order: 5
  - id: pdf
    label: Document Parsing
    order: 6
  - id: web-search
    label: Web Search
    order: 7
  - id: realtime
    label: Realtime Voice
    order: 8
providerGroups:
  - id: official
    label: Official
    order: 0
  - id: aggregator
    label: Aggregator
    order: 1
  - id: token_plan
    label: Token Plan
    order: 2
  - id: third_party
    label: Third Party
    order: 3
fieldSchemas:
  apiKey:
    type: secret
    label: API Key
  baseUrl:
    type: url
    label: Base URL
  modelId:
    type: string
    label: Model ID
serviceFieldSchemas:
  image:
    - id: aspectRatio
      label: Aspect Ratio
      type: select
      source: supportedAspectRatios
    - id: style
      label: Style
      type: select
      source: supportedStyles
  video:
    - id: aspectRatio
      label: Aspect Ratio
      type: select
      source: supportedAspectRatios
    - id: duration
      label: Duration (seconds)
      type: select
      source: supportedDurations
    - id: resolution
      label: Resolution
      type: select
      source: supportedResolutions
  tts:
    - id: backend
      label: Backend
      type: select
      source: backends
    - id: voiceId
      label: Voice
      type: select
      source: voices
    - id: format
      label: Audio Format
      type: select
      source: supportedFormats
    - id: speed
      label: Speed
      type: number
      source: speedRange
  asr:
    - id: language
      label: Language
      type: select
      source: supportedLanguages
    - id: format
      label: Audio Format
      type: select
      source: supportedFormats
  web-search:
    - id: sources
      label: Search Sources
      type: checkboxes
      source: subSources
